<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MMA Wall Assembly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>MMA Wall Assembly</h1>
    <span class="badge" id="mode-badge">New Wall</span>
  </header>

  <div class="card" style="padding: 8px 12px;">
    <label style="margin-bottom: 4px; display: block;">Quick MMA Presets</label>
    <div id="presets-container">
      <span class="preset-chip" onclick="applyPreset('ext_laterizio_cappotto')">Ext. Laterizio + Cappotto</span>
      <span class="preset-chip" onclick="applyPreset('ext_concrete_cappotto')">Ext. Concrete + Insulation</span>
      <span class="preset-chip" onclick="applyPreset('int_laterizio')">Int. Partition Laterizio</span>
      <span class="preset-chip" onclick="applyPreset('drywall_double')">Drywall Cartongesso (Double Board)</span>
      <span class="preset-chip" onclick="applyPreset('solid_brick')">Solid Brick 250mm</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">General Dimensions</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Wall Height (mm)</label>
        <input type="number" id="wall-height" value="2800" min="100" step="50">
      </div>
      <div class="form-group">
        <label>Justification</label>
        <select id="wall-justification">
          <option value="center">Center</option>
          <option value="exterior">Exterior Face</option>
          <option value="interior">Interior Face</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Structural Core</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Core Type</label>
        <select id="core-type" onchange="onCoreTypeChange()">
          <option value="poroton">Hollow Clay Block (Laterizio / Poroton)</option>
          <option value="concrete">Concrete (Calcestruzzo armato)</option>
          <option value="brick">Solid Brick (Mattone pieno)</option>
          <option value="aac_block">Aerated Concrete (Ytong / Blocco cls)</option>
          <option value="drywall">Drywall Partition (Cartongesso)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Core Thickness (mm)</label>
        <input type="number" id="core-thickness" value="250" min="20" step="5">
      </div>
      <div class="form-group" id="core-mat-group">
        <label>Material</label>
        <select id="core-material">
          <option value="EWS_Laterizio">EWS_Laterizio (Terracotta)</option>
          <option value="EWS_Concrete">EWS_Concrete (Concrete)</option>
          <option value="EWS_Brick">EWS_Brick (Brick)</option>
          <option value="EWS_Ytong">EWS_Ytong (AAC)</option>
        </select>
      </div>
    </div>
  </div>

  <script src="js/wall_dialog.js"></script>
</body>
</html>
