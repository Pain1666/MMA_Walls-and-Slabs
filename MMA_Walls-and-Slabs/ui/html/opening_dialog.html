<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MMA Opening Assembly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>MMA Opening Assembly</h1>
    <span class="badge" id="mode-badge">New Opening</span>
  </header>

  <div class="card">
    <div class="card-title">Opening Dimensions</div>
    <p class="opening-help">After confirming, place the cursor at the opening's lower-left corner on the wall. Cursor height sets the sill height.</p>
    <div class="form-grid">
      <div class="form-group">
        <label>Width (mm)</label>
        <input type="number" id="op-width" value="900" min="1" required>
      </div>
      <div class="form-group">
        <label>Height (mm)</label>
        <input type="number" id="op-height" value="2100" min="1" required>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="op-type">
          <option value="door">Door</option>
          <option value="window">Window</option>
        </select>
      </div>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="closeDialog()">Cancel</button>
    <button class="btn btn-primary" onclick="submitOpening()">Place Opening</button>
  </div>

  <script src="js/opening_dialog.js"></script>
</body>
</html>
