<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MMA Wall Assembly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>MMA Wall Assembly</h1>
    <span class="badge" id="mode-badge">New Wall</span>
  </header>

  <div class="card wall-type-card">
    <div class="card-title">Wall Types</div>
    <label for="wall-type-select">Saved wall type</label>
    <select id="wall-type-select">
      <option value="">-- Select a saved type --</option>
    </select>
    <div class="wall-type-name">
      <label for="wall-type-name">Wall type name</label>
      <input type="text" id="wall-type-name" maxlength="80" placeholder="Enter a name to save this type">
    </div>
    <div class="wall-type-actions">
      <button class="btn btn-secondary" type="button" onclick="newWallType()">New</button>
      <button class="btn btn-primary" type="button" onclick="saveWallType()">Save</button>
      <button class="btn btn-danger" type="button" id="delete-wall-type" onclick="deleteWallType()" disabled>Delete</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">General Dimensions</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Wall Height (mm)</label>
        <input type="number" id="wall-height" value="2800" min="100" step="50" required>
      </div>
      <div class="form-group">
        <label>Justification</label>
        <select id="wall-justification">
          <option value="center">Center</option>
          <option value="left">Left Face</option>
          <option value="right">Right Face</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Structural Core</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Core Type</label>
        <select id="core-type">
          <option value="hollow_brick">Hollow Clay Block</option>
          <option value="concrete">Reinforced Concrete Wall</option>
          <option value="brick">Solid Brick</option>
          <option value="concrete_block">Hollow Concrete Block</option>
          <option value="drywall">Drywall Partition</option>
        </select>
      </div>
      <div class="form-group">
        <label>Core Thickness (mm)</label>
        <input type="number" id="core-thickness" value="250" min="0" step="5" required>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Wall Layers</div>
    <div id="wall-layers"></div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="closeDialog()">Cancel</button>
    <button class="btn btn-primary" id="wall-submit" onclick="submitWall()">Okay</button>
  </div>

  <script src="js/wall_dialog.js"></script>
</body>
</html>
